http:
  routers:
    tourin-api-http:
      rule: "Host(`api-tourin.theoneeclarin.com`)"
      entryPoints:
        - web
      service: tourin-api-svc
      priority: 1
      middlewares:
        - tourin-https-redirect

    tourin-api:
      rule: "Host(`api-tourin.theoneeclarin.com`)"
      entryPoints:
        - websecure
      service: tourin-api-svc
      priority: 1
      tls: {}

    tourin-api-limited:
      rule: "Host(`api-tourin.theoneeclarin.com`) && Path(`/api/route`)"
      entryPoints:
        - websecure
      service: tourin-api-svc
      priority: 10
      tls: {}
      middlewares:
        - tourin-api-ratelimit

    tourin-traefik-dashboard:
      rule: "PathPrefix(`/api`) || PathPrefix(`/dashboard`)"
      entryPoints:
        - traefik
      service: api@internal

  middlewares:
    tourin-https-redirect:
      redirectScheme:
        scheme: https
        permanent: true

    tourin-api-ratelimit:
      rateLimit:
        average: 30
        burst: 60
        period: 1s
        sourceCriterion:
          requestHeaderName: CF-Connecting-IP

  services:
    tourin-api-svc:
      loadBalancer:
        servers:
          - url: "http://api:5000"
